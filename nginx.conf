# The Dashboard's web server inside the container (replaces `serve -s`, 2026-11-25). Port 3000 (docker-compose maps it to 8030 on the host; the Cloudflare
# tunnel's route for dashboard.vidasoftapi.com points at http://localhost:8030).
#
# Why nginx: `serve` (Node) closes an idle keep-alive connection after 5 s, while cloudflared keeps reusing its connections to the origin for 90 s, so a
# request could land on a connection the origin had just closed - an intermittent 502 or a hanging request through Cloudflare, while the origin itself
# answered every direct request. keepalive_timeout here is longer than cloudflared's 90 s, so the origin never closes a connection cloudflared still uses.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;

    keepalive_timeout 120s;
    keepalive_requests 10000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # For the container healthcheck and monitoring; not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build files never change: cached for a year. A file that is not there is a real 404 (not index.html), so a tab of an
    # older build gets a clean load error and reloads itself (src/lib/staleBuildReload.ts).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else: the file if it exists, otherwise the single-page app (index.html), never cached so a deploy is seen at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
