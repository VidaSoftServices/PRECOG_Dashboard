name: Deploy PRECOG Dashboard Facelift

on:
  push:
    branches:
      - Facelift

  workflow_dispatch:

concurrency:
  group: precog-dashboard-facelift
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Facelift to Windows Docker host

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 30

    steps:
      - name: Checkout Facelift source
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1

      - name: Check Docker
        shell: powershell
        run: |
          $dockerOs = docker info --format '{{.OSType}}'

          if ($LASTEXITCODE -ne 0) {
              throw "Docker is not available."
          }

          $dockerOs = $dockerOs.Trim()

          if ($dockerOs -ne "linux") {
              throw "Docker is not running in Linux container mode. Current mode: $dockerOs"
          }

          Write-Host "Docker container mode: $dockerOs"

          docker-compose version

          if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose is not available."
          }

      - name: Copy source to deployment directory
        shell: powershell
        run: |
          $sourcePath = $env:GITHUB_WORKSPACE
          $deployPath = "C:\Docker\Dashboard\PRECOG_Dashboard"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $deployPath |
            Out-Null

          robocopy `
            $sourcePath `
            $deployPath `
            /MIR `
            /XD ".git" ".github" "node_modules" `
            /XF ".env" ".env.*"

          $robocopyExitCode = $LASTEXITCODE

          if ($robocopyExitCode -ge 8) {
              throw "Robocopy failed with exit code $robocopyExitCode"
          }

          Write-Host "Source copied successfully to $deployPath"

          $global:LASTEXITCODE = 0

      - name: Create Vite production environment file
        shell: powershell
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          $deployPath = "C:\Docker\Dashboard\PRECOG_Dashboard"
          $envFile = Join-Path $deployPath ".env.production.local"

          if ([string]::IsNullOrWhiteSpace($env:VITE_API_BASE_URL)) {
              throw "GitHub repository variable VITE_API_BASE_URL is not configured."
          }

          "VITE_API_BASE_URL=$env:VITE_API_BASE_URL" |
            Set-Content `
              -Path $envFile `
              -Encoding UTF8

          Write-Host "Created Vite production environment file:"
          Write-Host $envFile

      - name: Validate deployment files
        shell: powershell
        run: |
          $deployPath = "C:\Docker\Dashboard\PRECOG_Dashboard"

          $requiredFiles = @(
              "docker-compose.yml",
              "Dockerfile",
              "package.json",
              ".env.production.local"
          )

          foreach ($requiredFile in $requiredFiles) {
              $fullPath = Join-Path $deployPath $requiredFile

              if (-not (Test-Path $fullPath)) {
                  throw "Required deployment file is missing: $fullPath"
              }

              Write-Host "Found: $fullPath"
          }

      - name: Build dashboard image
        shell: powershell
        run: |
          Set-Location "C:\Docker\Dashboard\PRECOG_Dashboard"

          docker-compose `
            -f docker-compose.yml `
            -p precog `
            build --no-cache

          if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose build failed with exit code $LASTEXITCODE"
          }

      - name: Start dashboard container
        shell: powershell
        run: |
          Set-Location "C:\Docker\Dashboard\PRECOG_Dashboard"

          docker-compose `
            -f docker-compose.yml `
            -p precog `
            up -d

          if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose deployment failed with exit code $LASTEXITCODE"
          }

      - name: Verify deployment
        shell: powershell
        run: |
          Set-Location "C:\Docker\Dashboard\PRECOG_Dashboard"

          docker-compose `
            -f docker-compose.yml `
            -p precog `
            ps

          if ($LASTEXITCODE -ne 0) {
              throw "Could not retrieve Docker Compose status."
          }

          Start-Sleep -Seconds 3

          # Read the inspect output as JSON: Windows PowerShell 5.1 strips the
          # embedded double quotes of a docker --format template.
          $inspectJson = docker inspect dashboard

          if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect the dashboard container."
          }

          $inspect = ($inspectJson -join "`n") | ConvertFrom-Json
          $containerStatus = $inspect[0].State.Status

          if ($containerStatus -ne "running") {
              throw "Dashboard container is not running. Current status: $containerStatus"
          }

          $composeProject = $inspect[0].Config.Labels.'com.docker.compose.project'

          if ($composeProject -ne "precog") {
              throw "Unexpected Compose project: $composeProject"
          }

          Write-Host "Dashboard deployment completed successfully."
          Write-Host "Compose project: $composeProject"
          Write-Host "Container: dashboard"
          Write-Host "Container status: $containerStatus"
          Write-Host "Address: http://localhost:8030"